openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: National Public Asset Management System (NPAMS) API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: locations
    description: Geographic locations
  - name: categories
    description: Asset categories
  - name: assets
    description: Asset management
  - name: dashboard
    description: Dashboard analytics
  - name: reports
    description: Reporting and exports
  - name: notifications
    description: User notifications

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required: [refresh_token]
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Reset link sent if email exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/auth/reset-password/validate:
    get:
      operationId: validatePasswordResetToken
      tags: [auth]
      summary: Validate a password reset token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token validity result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      email:
                        type: string
                        nullable: true
                      full_name:
                        type: string
                        nullable: true

  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Complete password reset using a single-use token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
              required: [token, new_password]
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/last-password-reset-email:
    get:
      operationId: getLastPasswordResetEmail
      tags: [users]
      summary: Get the most recent password reset email attempt for a user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest reset email attempt (data is null if none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    nullable: true
                    type: object
                    properties:
                      id:
                        type: string
                      recipientEmail:
                        type: string
                      requestedVia:
                        type: string
                      requestedById:
                        type: string
                        nullable: true
                      requestedByName:
                        type: string
                        nullable: true
                      requestedByEmail:
                        type: string
                        nullable: true
                      transport:
                        type: string
                      delivered:
                        type: boolean
                      messageId:
                        type: string
                        nullable: true
                      errorMessage:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time

  /v1/users/{id}/send-password-reset:
    post:
      operationId: sendUserPasswordReset
      tags: [users]
      summary: Email a single-use password reset link to the user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reset link emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                      delivered:
                        type: boolean
                      transport:
                        type: string
                      expires_at:
                        type: string
                        format: date-time

  /v1/users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List users (scoped)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserWithRole"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/users/{id}:
    get:
      operationId: getUserById
      tags: [users]
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/UserWithRole"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                phone_number:
                  type: string
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/users/{id}/deactivate:
    patch:
      operationId: deactivateUser
      tags: [users]
      summary: Deactivate user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/locations/provinces:
    get:
      operationId: getProvinces
      tags: [locations]
      summary: List all provinces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of provinces
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Province"

  /v1/locations/provinces/{id}:
    get:
      operationId: getProvinceById
      tags: [locations]
      summary: Get province by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Province details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Province"

  /v1/locations/provinces/{id}/districts:
    get:
      operationId: getDistrictsByProvince
      tags: [locations]
      summary: Get districts by province
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of districts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/District"

  /v1/locations/districts/{id}/facilities:
    get:
      operationId: getFacilitiesByDistrict
      tags: [locations]
      summary: Get facilities by district
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of facilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Facility"

  /v1/locations/facilities/{id}:
    get:
      operationId: getFacilityById
      tags: [locations]
      summary: Get facility by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Facility details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Facility"

  /v1/categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List asset categories
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssetCategory"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create asset category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_name:
                  type: string
                category_code:
                  type: string
                description:
                  type: string
              required: [category_name]
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/categories/{id}:
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Update category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_name:
                  type: string
                category_code:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/assets:
    get:
      operationId: getAssets
      tags: [assets]
      summary: List assets (scoped, paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: province_id
          in: query
          schema:
            type: string
        - name: district_id
          in: query
          schema:
            type: string
        - name: facility_id
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disposed, missing, under_maintenance]
        - name: condition
          in: query
          schema:
            type: string
            enum: [excellent, good, fair, poor]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated asset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create asset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/assets/{id}:
    get:
      operationId: getAssetById
      tags: [assets]
      summary: Get asset by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/AssetDetail"
    put:
      operationId: updateAsset
      tags: [assets]
      summary: Update asset
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetRequest"
      responses:
        "200":
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete asset (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/assets/{id}/qr-data:
    get:
      operationId: getAssetQrData
      tags: [assets]
      summary: Get QR code data for asset
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QR data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/QrData"

  /v1/dashboard/provincial:
    get:
      operationId: getProvincialDashboard
      tags: [dashboard]
      summary: Provincial dashboard summary
      security:
        - bearerAuth: []
      parameters:
        - name: province_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Provincial dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ProvincialDashboard"

  /v1/dashboard/national:
    get:
      operationId: getNationalDashboard
      tags: [dashboard]
      summary: National dashboard summary (national roles only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: National dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/NationalDashboard"

  /v1/reports/assets:
    get:
      operationId: getAssetsReport
      tags: [reports]
      summary: Full asset list for export (scoped)
      security:
        - bearerAuth: []
      parameters:
        - name: province_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Asset report data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AssetReportRow"
                      total:
                        type: integer

  /v1/reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Province-level summary for export
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Summary report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProvinceSummaryRow"

  /v1/notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: List notifications for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"

  /v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/stock:
    get:
      operationId: listStockItems
      tags: [stock]
      summary: List stock & inventory items in caller's scope
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: low_stock
          in: query
          description: When "true", returns only items at or below their reorder level
          schema: { type: string }
      responses:
        "200":
          description: Stock items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    post:
      operationId: createStockItem
      tags: [stock]
      summary: Create a stock item (admin only — excludes Provincial Asset Officer)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_code, item_name]
              properties:
                item_code: { type: string }
                item_name: { type: string }
                category: { type: string, nullable: true }
                description: { type: string, nullable: true }
                unit_of_measure: { type: string }
                on_hand_quantity: { type: integer }
                reorder_level: { type: integer }
                unit_cost: { type: string, nullable: true }
                supplier: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                province_id: { type: string, nullable: true }
                agency_id: { type: string, nullable: true }
                facility_id: { type: string, nullable: true }
      responses:
        "201":
          description: Stock item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/stock/{id}:
    get:
      operationId: getStockItem
      tags: [stock]
      summary: Stock item detail with movement history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stock item with movements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    patch:
      operationId: updateStockItem
      tags: [stock]
      summary: Update a stock item (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/stock/{id}/balances:
    patch:
      operationId: setStockBalanceReorder
      tags: [stock]
      summary: Set the per-location reorder threshold (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reorder_level]
              properties:
                facility_id: { type: string, nullable: true, description: "Null = agency reserve / unassigned" }
                reorder_level: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Threshold updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/stock/{id}/movements:
    get:
      operationId: listStockMovements
      tags: [stock]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Movements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    post:
      operationId: recordStockMovement
      tags: [stock]
      summary: Record a stock movement (officer or admin) — atomic with row-level lock
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movement_type, quantity]
              properties:
                movement_type:
                  type: string
                  enum: [receive, issue, transfer, adjust]
                quantity: { type: integer, minimum: 1 }
                from_facility_id: { type: string, nullable: true }
                to_facility_id: { type: string, nullable: true }
                issued_to_user: { type: string, nullable: true }
                issued_to_name: { type: string, nullable: true }
                reference: { type: string, nullable: true }
                reason: { type: string, nullable: true }
      responses:
        "201":
          description: Movement recorded; returns persisted on-hand quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/assets/{id}/lifecycle:
    get:
      operationId: getAssetLifecycle
      tags: [assets]
      summary: Chronological lifecycle events for an asset
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lifecycle events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/system/status:
    get:
      operationId: getSystemStatus
      tags: [system]
      summary: System health, backups & disaster recovery posture (Super Admin / Agency Admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/system/health-check:
    post:
      operationId: runSystemHealthCheck
      tags: [system]
      summary: Verify DB connectivity and record a backup checkpoint (Super Admin / Agency Admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Health check recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:

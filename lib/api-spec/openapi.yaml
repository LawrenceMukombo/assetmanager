          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true
          properties:
            status:
              type: string
      required: [success, message]

    SuccessResponse:
      type: object
      description: Standard API response envelope
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
      required: [success, message]


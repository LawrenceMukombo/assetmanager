kind = "web"
previewPath = "/"
title = "NPAMS — National Public Asset Management System"
version = "1.0.0"
id = "artifacts/npams-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24529

[services.development]
run = "pnpm --filter @workspace/npams-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/npams-web", "run", "build" ]
publicDir = "artifacts/npams-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24529"
BASE_PATH = "/"

kind = "api"
  previewPath = "/api"
  title = "API Server"
  version = "1.0.0"
  id = "3B4_FFSkEVBkAeYMFRJ2e"

  [[services]]
  localPort = 8080
  name = "API Server"
  paths = ["/api"]

  [services.development]
  run = "PORT=8080 pnpm --filter @workspace/api-server run dev"

  [services.production]
  build = ["sh", "-c", "pnpm --filter @workspace/npams-web run build && pnpm --filter @workspace/api-server run build && mkdir -p artifacts/api-server/dist/frontend && cp -r artifacts/npams-web/dist/public/. artifacts/api-server/dist/frontend/"]
  run = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

  [services.production.health.startup]
  path = "/api/healthz"
  